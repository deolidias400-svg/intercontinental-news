
name: Atualizar Intercontinental News

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-intercontinental-news
  cancel-in-progress: false

jobs:
  atualizar-jornal:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do jornal
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias e gerar edição
        run: python teste_rss.py

      - name: Publicar noticias.json atualizado
        run: |
          if git diff --quiet -- noticias.json; then
            echo "Nenhuma alteração nas notícias."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add noticias.json
            git commit -m "Atualização automática das notícias"
            git push
          fi
