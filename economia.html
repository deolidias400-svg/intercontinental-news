<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Economia — Intercontinental News</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e8dfc9;
            color: #171717;
            font-family: Georgia, "Times New Roman", serif;
        }

        .jornal {
            max-width: 1100px;
            margin: 20px auto;
            background: #f7f1df;
            padding: 25px;
            border: 3px double #222;
            box-shadow: 0 0 12px rgba(0,0,0,0.25);
        }

        .cabecalho {
            text-align: center;
            border-bottom: 3px double #222;
            padding-bottom: 15px;
        }

        .nome-jornal {
            font-size: clamp(32px, 6vw, 64px);
            font-weight: bold;
            letter-spacing: 3px;
        }

        .slogan {
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .data {
            margin-top: 15px;
            font-weight: bold;
            font-size: 17px;
        }

        .editoria {
            text-align: center;
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .edicao {
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            margin-top: 8px;
        }

        .pagina {
            text-align: center;
            font-size: 15px;
            margin-top: 5px;
        }

        .conteudo {
            margin-top: 30px;
        }

        .rotulo {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1.1;
            margin: 10px 0 15px;
        }

        .descricao {
            font-size: 20px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .descricao img {
            max-width: 100%;
            height: auto;
        }

        .data-noticia {
            margin-top: 18px;
            font-size: 15px;
            font-style: italic;
        }

        .fonte {
            margin-top: 15px;
        }

        .fonte a {
            color: #111;
            font-weight: bold;
        }

        .sem-noticias {
            text-align: center;
            padding: 50px 20px;
            border-top: 2px solid #222;
            border-bottom: 2px solid #222;
        }

        .sem-noticias h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .sem-noticias p {
            font-size: 19px;
            line-height: 1.6;
        }

        .rodape {
            margin-top: 45px;
            padding-top: 15px;
            border-top: 3px double #222;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .navegacao {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #555;
        }

        .navegacao a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
        }

        .navegacao a:hover {
            text-decoration: underline;
        }

        @media (max-width: 650px) {
            .jornal {
                margin: 8px;
                padding: 15px;
            }

            .navegacao {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="jornal">

    <header class="cabecalho">

        <div class="nome-jornal">
            INTERCONTINENTAL NEWS
        </div>

        <div class="slogan">
            O MUNDO EM UMA SÓ EDIÇÃO
        </div>

        <div class="data" id="data-edicao">
            Carregando data da edição...
        </div>

    </header>

    <div class="editoria">
        ECONOMIA
    </div>

    <div class="edicao">
        ECONOMIA • EDIÇÃO AUTOMÁTICA • PÁGINA 02
    </div>

    <main class="conteudo" id="resultado">

        <div class="sem-noticias">
            <h2>EDIÇÃO ECONÔMICA</h2>
            <p>Verificando as notícias disponíveis nesta edição...</p>
        </div>

    </main>

    <footer class="rodape">
        INTERCONTINENTAL NEWS • O MUNDO EM UMA SÓ EDIÇÃO
    </footer>

    <nav class="navegacao">

        <a href="brasil.html">
            ← ANTERIOR — BRASIL
        </a>

        <a href="mundo.html">
            PRÓXIMA — MUNDO →
        </a>

    </nav>

</div>

<script>
"use strict";

const FUSO_HORARIO = "America/Sao_Paulo";

function atualizarDataEdicao() {
    const elemento = document.getElementById("data-edicao");

    const dataAtual = new Intl.DateTimeFormat("pt-BR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric",
        timeZone: FUSO_HORARIO
    }).format(new Date());

    elemento.textContent = dataAtual.toLocaleUpperCase("pt-BR");
}

function escaparHTML(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[caractere]);
}

function formatarDataNoticia(valor) {
    if (!valor) {
        return "";
    }

    const texto = String(valor).trim();
    let data;

    // Datas sem horário são interpretadas sem deslocamento de dia.
    const somenteData = texto.match(/^(\d{4})-(\d{2})-(\d{2})$/);

    if (somenteData) {
        data = new Date(
            Number(somenteData[1]),
            Number(somenteData[2]) - 1,
            Number(somenteData[3]),
            12, 0, 0
        );
    } else {
        data = new Date(texto);
    }

    if (Number.isNaN(data.getTime())) {
        return texto;
    }

    return new Intl.DateTimeFormat("pt-BR", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        timeZone: FUSO_HORARIO
    }).format(data);
}

function enderecoSeguro(valor) {
    if (!valor) {
        return "";
    }

    try {
        const endereco = new URL(valor, window.location.href);

        if (
            endereco.protocol === "https:" ||
            endereco.protocol === "http:"
        ) {
            return endereco.href;
        }
    } catch (erro) {
        console.warn("Endereço de notícia inválido:", erro);
    }

    return "";
}

async function carregarEconomia() {
    const resultado = document.getElementById("resultado");

    try {
        const resposta = await fetch(
            "noticias.json?_=" + Date.now(),
            { cache: "no-store" }
        );

        if (!resposta.ok) {
            throw new Error("Não foi possível carregar noticias.json");
        }

        const dados = await resposta.json();

        if (!Array.isArray(dados)) {
            throw new Error("O formato de noticias.json é inválido");
        }

        const economia = dados.find(item =>
            item.editoria &&
            item.editoria.trim().toLocaleLowerCase("pt-BR") === "economia"
        );

        if (!economia || !economia.manchete) {
            resultado.innerHTML = `
                <div class="sem-noticias">
                    <h2>EDIÇÃO ECONÔMICA</h2>

                    <p>
                        Nenhuma notícia de Economia foi encontrada
                        nesta edição.
                    </p>

                    <p>
                        A página será preenchida quando o Motor da
                        Redação disponibilizar notícias desta editoria.
                    </p>
                </div>
            `;

            return;
        }

        const noticia = economia.manchete;
        const titulo = escaparHTML(noticia.titulo || "Notícia de Economia");
        const descricao = String(noticia.descricao || "");
        const dataNoticia = formatarDataNoticia(noticia.data);
        const link = enderecoSeguro(noticia.link);

        resultado.innerHTML = `
            <div class="rotulo">
                DESTAQUE ECONÔMICO
            </div>

            <h1>${titulo}</h1>

            <div class="descricao"></div>

            ${
                dataNoticia
                    ? `<div class="data-noticia">
                        Publicado em: ${escaparHTML(dataNoticia)}
                       </div>`
                    : ""
            }

            ${
                link
                    ? `<div class="fonte">
                        <a href="${escaparHTML(link)}"
                           target="_blank"
                           rel="noopener noreferrer">
                           LER NOTÍCIA COMPLETA →
                        </a>
                       </div>`
                    : ""
            }
        `;

        // Preserva a descrição que já vem do motor, inclusive
        // quando contém parágrafos HTML fornecidos pela fonte.
        resultado.querySelector(".descricao").innerHTML = descricao;

    } catch (erro) {
        resultado.innerHTML = `
            <div class="sem-noticias">
                <h2>ERRO NA EDIÇÃO</h2>

                <p>
                    Não foi possível carregar as notícias de Economia.
                </p>

                <p>
                    Verifique se o servidor local está funcionando
                    e se o arquivo <strong>noticias.json</strong>
                    está disponível.
                </p>
            </div>
        `;

        console.error("Erro ao carregar Economia:", erro);
    }
}

atualizarDataEdicao();
carregarEconomia();
</script>

</body>
</html>
